name: post-news

on:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 06:00 UTC (07:00/08:00 in Italia)
  workflow_dispatch:       # per lanciarlo a mano dal tab Actions

permissions:
  contents: write

concurrency: post-news

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Genera carosello
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: python main.py generate

      - name: Salva immagini nel repo (servono URL pubblici)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A out
          git commit -m "carosello $(date -u +%F-%H%M)" || true
          git push

      - name: Pubblica su Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python main.py publish
